name: Pipeline for build loadable extension

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  pr-title-check:
    name: PR Title Check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-22.04

    steps:
      - name: Check PR Title
        uses: actions/github-script@v8
        with:
          script: |
            const title = context.payload.pull_request.title;
            const pattern = /(^[mM]erge\s.*$)|(^[rR]evert\s.*$)|(^BREAKING CHANGE:.*$)|(^MINOR\s.*$)|(^(\w+)(?:\(([\w\$\.\-\*\s]+)\))?\:\s(.+)$)/;
            if (!pattern.test(title)) {
              core.setFailed(`PR title "${title}" doesn't match required format. Please use one of:
              - Conventional commit format: "type(scope): description"
              - Merge format: "Merge ..."
              - Revert format: "Revert ..."
              - Breaking change: "BREAKING CHANGE: description"
              - Minor change: "MINOR description"`);
            }

  lint:
    name: C++ Style Check
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Install clang-format-19
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 19 all
          sudo apt-get install -y clang-format-19

      - name: Verify C++ Code Style
        run: |
          find src/ include/ -name '*.cpp' -o -name '*.hpp' | xargs clang-format-19 --dry-run -Werror

  # Linux build runs inside a debian:11 container (glibc 2.31) so the resulting
  # extension loads on Debian 11 and any distro with glibc >= 2.31. Building
  # directly on ubuntu-22.04 (glibc 2.35) produced binaries requiring
  # GLIBC_2.32+ symbols (e.g. __libc_single_threaded) that are absent on
  # Debian 11. Tests still run on the runner outside the container (a glibc
  # 2.31 binary runs fine on the glibc 2.35 runner).
  build-linux:
    name: Linux Build and Test (debian:11)
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          submodules: true
          fetch-depth: 0
          fetch-tags: true

      - name: Install Runner Dependencies (for tests)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends python3-pip ccache

      - name: Cache Arrow and GraphAr
        id: cache-third-party
        uses: actions/cache@v5
        with:
          path: |
            third_party/
          key: linux-third-party-${{ hashFiles('Makefile') }}
          restore-keys: |
            linux-third-party

      - name: Skip Arrow/GraphAr build if cached
        if: steps.cache-third-party.outputs.cache-hit == 'true'
        run: |
          echo "Arrow and GraphAr restored from cache"

      - name: Build extension (inside debian:11 container)
        run: |
          mkdir -p ccache_dir
          docker run --rm \
            -v `pwd`:/duckdb_build_dir \
            -v `pwd`/ccache_dir:/ccache_dir \
            debian:11 bash -lc '
              set -e
              export DEBIAN_FRONTEND=noninteractive
              # Debian 11 (bullseye) is EOL: packages moved to archive.debian.org,
              # deb.debian.org returns 404, and the archive has no
              # "bullseye-security" dist (security updates live in
              # "bullseye/updates"). Rewrite sources.list with the correct
              # archive URLs.
              # NOTE: whole script is wrapped in single quotes, so use double
              # quotes inside (no single quotes).
              cat > /etc/apt/sources.list <<EOF2
              deb http://archive.debian.org/debian bullseye main contrib non-free
              deb http://archive.debian.org/debian bullseye-updates main contrib non-free
              deb http://archive.debian.org/debian-security bullseye/updates main contrib non-free
              EOF2
              echo "APT::Acquire::Check-Valid-Until \"false\";" > /etc/apt/apt.conf.d/99nocheckvalid
              apt-get update -qq -o Acquire::AllowInsecureRepositories=true -o Acquire::AllowDowngradeToInsecureRepositories=true
              apt-get install -y -qq --allow-unauthenticated build-essential git pkg-config curl \
                libcurl4-openssl-dev libssl-dev zlib1g-dev libzstd-dev libsnappy-dev \
                ccache python3 python3-pip
              # debian:11 ships cmake 3.18; use a newer cmake + ninja via pip.
              pip3 install -q cmake ninja
              export PATH=/usr/local/bin:$PATH
              export CCACHE_DIR=/ccache_dir
              export CXX="ccache g++"
              export CC="ccache gcc"
              cd /duckdb_build_dir && make release
            '

      - name: Verify DuckDB build version
        run: |
          VERSION=$(build/release/duckdb --version)
          echo "DuckDB version: $VERSION"
          if echo "$VERSION" | grep -q 'v0\.0\.1'; then
            echo "::warning::DuckDB build reports v0.0.1 (shallow clone or git describe failed). Expected a real version like v1.5.5. Manually verify this is intended."
          else
            echo "DuckDB version looks correct (not v0.0.1)."
          fi

      - name: Install GraphAr CLI and Generate Data
        run: |
          pip3 install --upgrade pip
          ./scripts/install-cli.sh || exit 1
          ./scripts/generate-graphar-data.sh || exit 1

      - name: Run tests
        run: |
          make test

      - name: Prepare Artifacts for Upload
        run: |
          mkdir -p upload-artifacts

          cp build/release/duckdb upload-artifacts/
          cp build/release/extension/duckdb_graphar/duckdb_graphar.duckdb_extension upload-artifacts/

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: duckdb-graphar-linux
          path: upload-artifacts
          if-no-files-found: error

  build-macos:
    name: macOS Build and Test
    runs-on: macos-14
    timeout-minutes: 120

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          submodules: true
          fetch-depth: 0
          fetch-tags: true

      - name: Install System Dependencies (macOS)
        run: brew install ccache

      - name: Set up specific CMake version (macOS)
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.28.3'

      - name: Set up ccache
        run: |
          mkdir -p ${{ runner.workspace }}/.ccache
          echo "CCACHE_DIR=${{ runner.workspace }}/.ccache" >> $GITHUB_ENV
          echo "/usr/local/opt/ccache/libexec" >> $GITHUB_PATH

      - name: Cache ccache
        uses: actions/cache@v5
        with:
          path: ${{ runner.workspace }}/.ccache
          key: macos-ccache-${{ hashFiles('Makefile', 'CMakeLists.txt', 'extension_config.cmake') }}
          restore-keys: |
            macos-ccache

      - name: Cache Arrow and GraphAr
        id: cache-third-party
        uses: actions/cache@v5
        with:
          path: |
            third_party/
          key: macos-third-party-${{ hashFiles('Makefile') }}
          restore-keys: |
            macos-third-party

      - name: Skip Arrow/GraphAr build if cached
        if: steps.cache-third-party.outputs.cache-hit == 'true'
        run: |
          echo "Arrow and GraphAr restored from cache"

      - name: Build
        run: |
          make release

      - name: Prepare Artifacts for Upload
        run: |
          mkdir -p upload-artifacts

          cp build/release/duckdb upload-artifacts/
          cp build/release/extension/duckdb_graphar/duckdb_graphar.duckdb_extension upload-artifacts/

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: duckdb-graphar-macos
          path: upload-artifacts
          if-no-files-found: error