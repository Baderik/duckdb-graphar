name: Pipeline for build loadable extension

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  pr-title-check:
    name: PR Title Check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-22.04

    steps:
      - name: Check PR Title
        uses: actions/github-script@v6
        with:
          script: |
            const title = context.payload.pull_request.title;
            const pattern = /(^[mM]erge\s.*$)|(^[rR]evert\s.*$)|(^BREAKING CHANGE:.*$)|(^MINOR\s.*$)|(^(\w+)(?:\(([\w\$\.\-\*\s]+)\))?\:\s(.+)$)/;
            if (!pattern.test(title)) {
              core.setFailed(`PR title "${title}" doesn't match required format. Please use one of:
              - Conventional commit format: "type(scope): description"
              - Merge format: "Merge ..."
              - Revert format: "Revert ..."
              - Breaking change: "BREAKING CHANGE: description"
              - Minor change: "MINOR description"`);
            }

  lint:
    name: C++ Style Check
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install clang-format-19
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 19 all
          sudo apt-get install -y clang-format-19

      - name: Verify C++ Code Style
        run: |
          find src/ include/ -name '*.cpp' -o -name '*.hpp' | xargs clang-format-19 --dry-run -Werror

  # Linux build runs inside the manylinux_2_28 container (glibc 2.28) so the
  # resulting extension is loadable on any Linux distro with glibc >= 2.28
  # (e.g. Debian 11 = glibc 2.31). Building directly on ubuntu-22.04 (glibc
  # 2.35) produced binaries requiring GLIBC_2.32+, which fail to load on
  # Debian 11. The Dockerfile comes from extension-ci-tools (same environment
  # the official extension-template uses). Arrow/GraphAr are built from source
  # (ARROW_DEPENDENCY_SOURCE=BUNDLED) so no system dev packages are needed
  # inside the container. Tests run on the runner outside the container (a
  # glibc 2.28 binary runs fine on the glibc 2.35 runner).
  build-linux:
    name: Linux Build and Test (manylinux)
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    env:
      DUCKDB_PLATFORM: linux_amd64
      GEN: ninja
      EXTENSION_NAME: graphar_duck
      LINUX_CI_IN_DOCKER: 1
      CCACHE_MAXSIZE: 1G
      CCACHE_NOCOMPRESS: 1
      CCACHE_DIR: /ccache_dir

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
          fetch-tags: true

      - name: Install Runner Dependencies (for tests)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends python3-pip ccache

      - name: Cache Arrow and GraphAr
        id: cache-third-party
        uses: actions/cache@v4
        with:
          path: |
            third_party/
          key: linux-third-party-${{ hashFiles('Makefile') }}
          restore-keys: |
            linux-third-party

      - name: Skip Arrow/GraphAr build if cached
        if: steps.cache-third-party.outputs.cache-hit == 'true'
        run: |
          echo "Arrow and GraphAr restored from cache"

      - name: Set up DuckDB
        id: duckdb-version
        run: |
          git submodule update --init duckdb
          cd duckdb
          git fetch --tags origin
          cd ..
          DUCKDB_GIT_VERSION=$(cat .github/duckdb_version) make set_duckdb_version
          cd duckdb && echo "duckdb_hash=$(git rev-parse HEAD)"

      - name: Build DuckDB GraphAr Docker image
        run: |
          docker build \
            --build-arg 'vcpkg_url=https://github.com/microsoft/vcpkg.git' \
            --build-arg 'vcpkg_commit=84bab45d415d22042bd0b9081aea57f362da3f35' \
            --build-arg 'extra_toolchains=;' \
            -t duckdb/linux_amd64 \
            ./extension-ci-tools/docker/linux_amd64

      - name: Create Docker env file
        run: |
          cat <<-EOF > docker_env.txt
          GEN=$GEN
          DUCKDB_PLATFORM=$DUCKDB_PLATFORM
          EXTENSION_NAME=$EXTENSION_NAME
          LINUX_CI_IN_DOCKER=$LINUX_CI_IN_DOCKER
          CCACHE_MAXSIZE=$CCACHE_MAXSIZE
          CCACHE_NOCOMPRESS=$CCACHE_NOCOMPRESS
          # manylinux_2_28 is RHEL-like: 64-bit libs live under /usr/lib64, but
          # CMake find_library (used by FindOpenSSL/FindCURL in the bundled AWS
          # SDK pulled by ARROW_S3) looks in /usr/lib by default. Point it at
          # the real lib dir for the whole build.
          OPENSSL_ROOT_DIR=/usr
          CMAKE_LIBRARY_PATH=/usr/lib64
          EOF

      - name: Build extension (inside Docker)
        run: |
          mkdir -p ccache_dir
          # ARROW_S3=ON pulls the bundled AWS SDK, which calls find_package(CURL)
          # and find_package(OpenSSL). manylinux_2_28 ships no dev headers by
          # default, so install libcurl-devel and openssl-devel, then export the
          # OpenSSL library paths that FindOpenSSL is failing to locate.
          docker run --env-file=docker_env.txt \
            -v `pwd`:/duckdb_build_dir \
            -v `pwd`/ccache_dir:/ccache_dir \
            duckdb/linux_amd64 bash -lc '
              # ARROW_S3 pulls the bundled AWS SDK, which needs a STATIC
              # OpenSSL (libcrypto.a) -- the build log shows
              # "crypto_STATIC_LIBRARY: $<TARGET_FILE:crypto>". Install the
              # curl + openssl dev packages (RHEL/el8 vs Debian/Ubuntu).
              if command -v apt-get >/dev/null 2>&1; then
                export DEBIAN_FRONTEND=noninteractive
                apt-get update -qq
                apt-get install -y -qq libcurl4-openssl-dev libssl-dev zlib1g-dev
              else
                yum install -y libcurl-devel openssl-devel zlib-devel
              fi
              # The container base may be RHEL-like (/usr/lib64) or
              # Debian/Ubuntu (/usr/lib/x86_64-linux-gnu). Rather than guess,
              # locate the real lib/header dirs and point CMake at them so
              # FindCURL / FindOpenSSL resolve.
              CURL_LIB_DIR=$(dirname "$(find /usr -name 'libcurl.so*' 2>/dev/null | head -1)")
              CURL_INC_DIR=$(dirname "$(find /usr -path '*curl/curl.h' 2>/dev/null | head -1)")
              export CMAKE_LIBRARY_PATH="$CURL_LIB_DIR"
              export CMAKE_INCLUDE_PATH="$CURL_INC_DIR"
              echo "CURL_LIB_DIR=$CURL_LIB_DIR"
              echo "CURL_INC_DIR=$CURL_INC_DIR"
              ls -l "$CURL_LIB_DIR"/libcurl.so* 2>/dev/null || true
              ls -l "$CURL_INC_DIR"/curl/curl.h 2>/dev/null || true
              # aws-c-cal (bundled AWS SDK) needs a STATIC libcrypto.a. The
              # RHEL/el8 openssl-devel only ships .so (no libcrypto.a), and
              # openssl-static is not in the repo. If the static lib is missing,
              # build OpenSSL 1.1.1k from source with no-shared into /usr/local
              # and point FindOpenSSL at it.
              if ! ls /usr/lib64/libcrypto.a /usr/lib/x86_64-linux-gnu/libcrypto.a >/dev/null 2>&1; then
                echo "=== Static libcrypto.a missing; building OpenSSL 1.1.1k from source ==="
                cd /tmp && rm -rf openssl-1.1.1k* && \
                curl -fsSL https://www.openssl.org/source/old/1.1.1/openssl-1.1.1k.tar.gz -o openssl.tar.gz && \
                tar xzf openssl.tar.gz && cd openssl-1.1.1k && \
                ./config --prefix=/usr/local --openssldir=/usr/local/ssl no-shared && \
                make -j$(nproc) && make install_sw
                export OPENSSL_ROOT_DIR=/usr/local
                echo "OPENSSL_ROOT_DIR=/usr/local (built static)"
              else
                echo "Static libcrypto.a already present"
                ls -l /usr/lib64/libcrypto.a /usr/lib/x86_64-linux-gnu/libcrypto.a 2>/dev/null || true
              fi
              make release
            '

      - name: Verify DuckDB build version
        run: |
          VERSION=$(build/release/duckdb --version)
          echo "DuckDB version: $VERSION"
          if echo "$VERSION" | grep -q 'v0\.0\.1'; then
            echo "::warning::DuckDB build reports v0.0.1 (shallow clone or git describe failed). Expected a real version like v1.5.5. Manually verify this is intended."
          else
            echo "DuckDB version looks correct (not v0.0.1)."
          fi

      - name: Install GraphAr CLI and Generate Data
        run: |
          pip3 install --upgrade pip
          ./scripts/install-cli.sh || exit 1
          ./scripts/generate-graphar-data.sh || exit 1

      - name: Run tests
        run: |
          make test

      - name: Prepare Artifacts for Upload
        run: |
          mkdir -p upload-artifacts

          cp build/release/duckdb upload-artifacts/
          cp build/release/extension/duckdb_graphar/duckdb_graphar.duckdb_extension upload-artifacts/

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: duckdb-graphar-linux-amd64
          path: upload-artifacts
          if-no-files-found: error

  build-macos:
    name: macOS Build and Test
    runs-on: macos-14
    timeout-minutes: 120

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install System Dependencies (macOS)
        run: brew install ccache

      - name: Set up specific CMake version (macOS)
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.28.3'

      - name: Set up ccache
        run: |
          mkdir -p ${{ runner.workspace }}/.ccache
          echo "CCACHE_DIR=${{ runner.workspace }}/.ccache" >> $GITHUB_ENV
          echo "/usr/local/opt/ccache/libexec" >> $GITHUB_PATH

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ${{ runner.workspace }}/.ccache
          key: macos-ccache-${{ hashFiles('Makefile', 'CMakeLists.txt', 'extension_config.cmake') }}
          restore-keys: |
            macos-ccache

      - name: Cache Arrow and GraphAr
        id: cache-third-party
        uses: actions/cache@v4
        with:
          path: |
            third_party/
          key: macos-third-party-${{ hashFiles('Makefile') }}
          restore-keys: |
            macos-third-party

      - name: Skip Arrow/GraphAr build if cached
        if: steps.cache-third-party.outputs.cache-hit == 'true'
        run: |
          echo "Arrow and GraphAr restored from cache"

      - name: Set up DuckDB
        id: duckdb-version
        run: |
          git submodule update --init duckdb
          cd duckdb
          git fetch --tags origin
          cd ..
          DUCKDB_GIT_VERSION=$(cat .github/duckdb_version) make set_duckdb_version
          cd duckdb && echo "duckdb_hash=$(git rev-parse HEAD)"

      - name: Build
        run: |
          make release

      - name: Prepare Artifacts for Upload
        run: |
          mkdir -p upload-artifacts

          cp build/release/duckdb upload-artifacts/
          cp build/release/extension/duckdb_graphar/duckdb_graphar.duckdb_extension upload-artifacts/

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: duckdb-graphar-macos
          path: upload-artifacts
          if-no-files-found: error